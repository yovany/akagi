# Videolog — un solo archivo, tres listas. Para registrar algo:
#   1. Borra la línea de `pendientes`.
#   2. Pégala en `vistas` (o `viendo`) con los campos de abajo.
#
# viendo:    - {t: "Título", tipo: serie, via: "HBO Max", estreno: "2026-08-16", vistos: 3}   # vistos: capítulos vistos, en orden
#             o  al_dia: true  = ya viste todos los capítulos estrenados hasta hoy
# vistas:    - {t: "Título", tipo: pelicula|serie, donde: cine|streaming, estreno: "2026-03-08", fecha: "2026-03-10", nota: 9}
#             (fecha = cuándo la viste y nota son opcionales; en series, "vistas" = todos los capítulos)
# pendientes: - {t: "Título", o: "Título original", tipo: pelicula|serie, estreno: "2026-03-05", via: "Netflix"}
#
# Fechas de películas: estreno en cines de México (Cinemex/Cinépolis/Excélsior/Milenio).
# Fechas de series: fecha de la plataforma (global). No verifiqué que cada plataforma tenga
# el título disponible en México.
# Estrenos en miércoles pueden ser preestreno; el oficial suele ser el jueves.

